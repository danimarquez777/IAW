limit_req_zone $binary_remote_addr zone=nimbus_limit:10m rate=10r/s;




server {
    listen 80;
    server_name nimbus-legal.local nimbus-tech.local;

    return 301 https://$host:8443$request_uri;
}

server {
    listen 443 ssl;
    server_name nimbus-legal.local nimbus-tech.local;

    ssl_certificate /etc/nginx/certs/nimbus.crt;
    ssl_certificate_key /etc/nginx/certs/nimbus.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-XSS-Protection "0" always;

    location / {
        limit_req zone=nimbus_limit burst=20 nodelay;
        proxy_pass http://apache:80;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
