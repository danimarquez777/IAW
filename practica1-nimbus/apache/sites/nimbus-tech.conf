<VirtualHost *:80>
    ServerName nimbus-tech.local

    DocumentRoot /var/www/nimbus-tech

    <Directory /var/www/nimbus-tech>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/nimbus-tech_error.log
    CustomLog ${APACHE_LOG_DIR}/nimbus-tech_access.log combined
</VirtualHost>
