<VirtualHost *:80>
    ServerName nimbus-legal.local

    DocumentRoot /var/www/nimbus-legal

    <Directory /var/www/nimbus-legal>
        Options -Indexes
        AllowOverride None
        Require all granted
    </Directory>

    <Files "vault-credentials.txt">
        Require all denied
    </Files>

    ErrorLog ${APACHE_LOG_DIR}/nimbus-legal_error.log
    CustomLog ${APACHE_LOG_DIR}/nimbus-legal_access.log combined
</VirtualHost>
