# rate=3r/s permite el tráfico sostenido legítimo del escenario
limit_req_zone $binary_remote_addr zone=nimbus_limit:10m rate=3r/s;

# Redirección de HTTP a HTTPS (Código 301)
server {
    listen 80;
    server_name nimbus-tech.local nimbus-legal.local;
    return 301 https://$host$request_uri;
}

# Servidor HTTPS con proxy inverso y seguridad
server {
    listen 443 ssl;
    server_name nimbus-tech.local nimbus-legal.local;

    # Certificados TLS (ECDSA)
    ssl_certificate     /etc/nginx/ssl/nimbus-tech.crt;
    ssl_certificate_key /etc/nginx/ssl/nimbus-tech.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Cabeceras de seguridad requeridas
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    location / {
        # Aplicación del límite de peticiones calculado
        # burst=6 permite picos de pestañas, nodelay responde inmediatamente sin encolar
        limit_req zone=nimbus_limit burst=6 nodelay;

        proxy_pass http://127.0.0.1:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
